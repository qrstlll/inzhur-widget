name: Update INZHUR REIT purchase price

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Read official INZHUR REIT page and update price
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from decimal import Decimal, ROUND_HALF_UP
          import requests
          from bs4 import BeautifulSoup

          url = "https://www.inzhur.reit/offer/inzhur-reit"
          response = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0 (compatible; InzhurWidgetPriceUpdater/1.0)"},
              timeout=30,
          )
          response.raise_for_status()
          text = BeautifulSoup(response.text, "html.parser").get_text(" ", strip=True)
          text = text.replace("\xa0", " ").replace("\u202f", " ")
          match = re.search(
              r"([0-9][0-9\s]*[.,][0-9]+)\s*₴\s*ВЧА на сертифікат",
              text,
              re.IGNORECASE,
          )
          if not match:
              raise SystemExit("Could not find official NAV per certificate; leaving portfolio.json unchanged.")

          nav_text = re.sub(r"\s+", "", match.group(1)).replace(",", ".")
          nav = Decimal(nav_text)
          # INZHUR's published pricing description says purchase price = NAV + 1%.
          purchase_price = (nav * Decimal("1.01")).quantize(
              Decimal("0.01"), rounding=ROUND_HALF_UP
          )

          path = Path("portfolio.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          old_price = Decimal(str(data["price"]))
          if old_price == purchase_price:
              print(f"Price is already up to date: {purchase_price}")
          else:
              data["price"] = float(purchase_price)
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              print(f"Updated purchase price: {old_price} -> {purchase_price}")
          PY

      - name: Commit updated price if changed
        run: |
          if ! git diff --quiet -- portfolio.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add portfolio.json
            git commit -m "Update INZHUR REIT purchase price"
            git push
          else
            echo "No price change to commit."
          fi
